<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Section 6 Test</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #fafafa;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      max-width: 900px;
      line-height: 1.5;
      color: #555;
      margin-bottom: 30px;
    }

    .chart-block {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 24px;
      margin-top: 24px;
      margin-bottom: 36px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .status {
      padding: 12px 16px;
      background: #eef7ee;
      border: 1px solid #b7dfb7;
      color: #255625;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: white;
      border: 1px solid #ddd;
      padding: 10px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 13px;
      line-height: 1.4;
      opacity: 0;
      max-width: 280px;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <h1>Section 6: Scientific Portfolios of the Greek Diaspora</h1>

  <p class="subtitle">
    This test page checks whether the new Section 6 processed data can be loaded correctly before we integrate the charts into the main website.
  </p>

  <div class="chart-block">
    <h2>Data Loading Status</h2>
    <div id="status"></div>
  </div>

  <div class="chart-block">
    <h2>Country × Field Bubble Heatmap</h2>
    <div id="heatmap"></div>
  </div>

  <div class="chart-block">
    <h2>Generalist Hubs vs Specialized Hubs</h2>
    <div id="diversity"></div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script src="js/section6_portfolio.js"></script>
</body>
</html>
